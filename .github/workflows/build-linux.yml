name: Build Linux AppImage

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('candidate-{0}', github.run_number) }}

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # librsvg/imagemagick: icon generation; libegl/libgl: PyQt6 import
          sudo apt-get install -y librsvg2-bin imagemagick libegl1 libgl1

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Generate icons
        run: bash build/generate-icons.sh

      - name: Build with PyInstaller
        run: pyinstaller build/s3ui.spec

      - name: Build AppImage
        env:
          # Let appimagetool run without FUSE on the runner
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash build/scripts/make-appimage.sh "${BUILD_VERSION}"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: S3UI-linux-appimage
          path: S3UI-*.AppImage

      - name: Attach AppImage to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: S3UI-*.AppImage
