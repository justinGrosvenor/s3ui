name: Build Windows Installer

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('candidate-{0}', github.run_number) }}

jobs:
  # Icon conversion needs rsvg-convert, which is painful on Windows —
  # generate on Linux and hand the results to the Windows build
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          bash build/generate-icons.sh

      - name: Upload icons artifact
        uses: actions/upload-artifact@v4
        with:
          name: icons
          path: build/icons/

  build-windows:
    runs-on: windows-latest
    needs: icons
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download icons artifact
        uses: actions/download-artifact@v4
        with:
          name: icons
          path: build/icons/

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller build/s3ui.spec

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        shell: pwsh
        run: |
          # Run from the repo root so the script's dist\S3UI path resolves
          Copy-Item build\installer.nsi .
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /DVERSION=$env:BUILD_VERSION installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: S3UI-windows-installer
          path: S3UI-Setup-*.exe

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: S3UI-Setup-*.exe
