name: Build Windows Installer

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('candidate-{0}', github.run_number) }}

permissions:
  contents: read

jobs:
  # Icon conversion needs rsvg-convert, which is painful on Windows —
  # generate on Linux and hand the results to the Windows build
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          bash build/generate-icons.sh

      - name: Upload icons artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icons
          path: build/icons/

  build-windows:
    runs-on: windows-latest
    needs: icons
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download icons artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: icons
          path: build/icons/

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller build/s3ui.spec

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        shell: pwsh
        run: |
          # Run from the repo root so the script's dist\S3UI path resolves
          Copy-Item build\installer.nsi .
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /DVERSION=$env:BUILD_VERSION installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: S3UI-windows-installer
          path: S3UI-Setup-*.exe

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: S3UI-Setup-*.exe
